services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3010}:3010"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3011/api/v1}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  api:
    build:
      context: ./backend
    ports:
      - "${API_PORT:-3011}:3011"
    environment:
      PORT: 3011
      DATABASE_URL: postgresql://${POSTGRES_USER:-todo_app}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-todo_app}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3010}
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo_app}
      POSTGRES_USER: ${POSTGRES_USER:-todo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  api_node_modules:
  frontend_node_modules:
  postgres_data:
