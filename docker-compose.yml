services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3010}:3010"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3011/api/v1}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  api:
    build:
      context: ./backend-laravel
    ports:
      - "${API_PORT:-3011}:3011"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-todo_app}
      DB_USERNAME: ${MYSQL_USER:-todo_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      APP_URL: http://localhost:${API_PORT:-3011}
      SESSION_DOMAIN: localhost
      SANCTUM_STATEFUL_DOMAINS: localhost:${FRONTEND_PORT:-3010}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3010}
    volumes:
      - ./backend-laravel:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-todo_app}
      MYSQL_USER: ${MYSQL_USER:-todo_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  frontend_node_modules:
  mysql_data:
