services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3010}:3010"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3011/api/v1}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  api:
    build:
      context: ./backend-laravel
    ports:
      - "${API_PORT:-3011}:3011"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-todo_app}
      DB_USERNAME: ${POSTGRES_USER:-todo_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      APP_URL: http://localhost:${API_PORT:-3011}
      SESSION_DOMAIN: localhost
      SANCTUM_STATEFUL_DOMAINS: localhost:${FRONTEND_PORT:-3010}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3010}
    volumes:
      - ./backend-laravel:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo_app}
      POSTGRES_USER: ${POSTGRES_USER:-todo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  postgres_data:
